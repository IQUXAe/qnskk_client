name: QNSKK Build APK (No Release)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Custom build version string (e.g. 1.0.1 or 2.0.0-beta)'
        required: true
        default: '1.0.1'
      build_number:
        description: 'Custom version code / build number (e.g. 10001). Leave empty to calculate automatically.'
        required: false
        default: ''

jobs:
  build-apk:
    name: Build Signed APKs (Custom Version)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Free up disk space
        uses: ./.github/actions/free_up_space

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get Dependencies
        run: flutter pub get

      - name: Decode Android Keystore & Verify Signature
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        run: |
          python3 -c "
          import base64, hashlib, os, subprocess

          b64_raw = os.environ.get('KEYSTORE_BASE64', '')
          b64_clean = ''.join(b64_raw.split())
          keystore_bytes = base64.b64decode(b64_clean)
          sha256_hash = hashlib.sha256(keystore_bytes).hexdigest()

          os.makedirs('android/app', exist_ok=True)
          with open('android/app/qnskk-release.jks', 'wb') as f:
              f.write(keystore_bytes)

          alias = os.environ.get('KEY_ALIAS', '').strip() or 'qnskk-release-key'
          key_pass = os.environ.get('KEY_PASSWORD', '').strip()
          store_pass = os.environ.get('STORE_PASSWORD', '').strip()

          if not key_pass or not store_pass:
              print('[ERROR] ANDROID_KEY_PASSWORD and ANDROID_STORE_PASSWORD must be set in GitHub Secrets!')
              raise SystemExit(1)

          content = f'keyAlias={alias}\nkeyPassword={key_pass}\nstoreFile=app/qnskk-release.jks\nstorePassword={store_pass}\n'
          with open('android/key.properties', 'w') as f:
              f.write(content)

          print(f'[CI] Keystore size: {len(keystore_bytes)} bytes | SHA256: {sha256_hash}')
          print(f'[CI] key.properties written with alias \"{alias}\"')

          res = subprocess.run(['keytool', '-list', '-keystore', 'android/app/qnskk-release.jks', '-storepass', store_pass], capture_output=True, text=True)
          if res.returncode != 0:
              print(f'[ERROR] keytool validation failed for storepass length {len(store_pass)}:')
              print(f'STDOUT: {res.stdout.strip()}')
              print(f'STDERR: {res.stderr.strip()}')
              raise SystemExit(1)
          print('[CI] Keystore password verified successfully with keytool!')
          "

      - name: Build Split-Per-ABI & Universal APKs with Custom Version
        run: |
          VERSION="${{ inputs.version }}"
          BUILD_NUM="${{ inputs.build_number }}"

          if [ -z "$BUILD_NUM" ]; then
            IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
            BUILD_NUM=$(( ${MAJOR:-1} * 10000 + ${MINOR:-0} * 100 + ${PATCH:-0} ))
          fi

          echo "[CI] Building APK version=$VERSION (build-name) with version_code=$BUILD_NUM (build-number)"

          flutter build apk --release --split-per-abi --build-name="$VERSION" --build-number="$BUILD_NUM"
          flutter build apk --release --build-name="$VERSION" --build-number="$BUILD_NUM"

      - name: Organize APK Artifacts
        run: |
          VERSION="${{ inputs.version }}"
          mkdir -p build_artifacts
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk build_artifacts/qnskk-v${VERSION}-arm64-v8a.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk build_artifacts/qnskk-v${VERSION}-armeabi-v7a.apk
          cp build/app/outputs/flutter-apk/app-release.apk build_artifacts/qnskk-v${VERSION}-universal.apk

      - name: Upload APKs as Workflow Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: qnskk-apks-v${{ inputs.version }}
          path: build_artifacts/*.apk
          retention-days: 14
